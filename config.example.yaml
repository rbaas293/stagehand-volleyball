# stagehand-volleyball config (shared by the TypeScript scraper and python/).
#
# Copy this file to config.yaml and edit it:
#   cp config.example.yaml config.yaml
#
# You must set at least one of captainName or teamName.
# Keep string values in double quotes so characters like ":" or "#" are never misread.

captainName:
  - "H. Robinson"
  - "Ryan Baas"
  - "R. Baas"
  - "R Baas"

teamName: "Win or Lose We Booze"

# lean = pub-api HTTP (no LLM); llm = Stagehand extract. Override: SCRAPE_MODE=lean|llm
mode: "lean"

# Multi-division: every division whose league/division name contains any substring.
levels:
  - "Beer A"
  - "Beer B"

siteUrl: "https://flannagans.league.ninja"

day: "Sunday"
league: "Summer III- 2026 › Beer A / Beer B (all days)"

# Single-division URL (back-compat when levels is empty); also helps infer apiBaseUrl.
leagueUrl: "https://flannagans.league.ninja/leagues/division/8f285cc6-16d2-43ff-88ad-66a2d8a41b9a"

model: "grok-4-fast-reasoning"
schedulePathSuffix: "/schedule"
