name: Python CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      skip_gate:
        description: >
          If true, skip the PR #1 merge gate so checks/wheels/shiv can run
          before the scraper PR is merged. Documented verification escape hatch
          only — leave false for normal CI.
        required: false
        type: boolean
        default: false

# Cancel overlapping runs on the same ref (keeps PR checks tidy).
concurrency:
  group: python-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Configurable: which PR must be merged before the rest of CI can pass.
  SCRAPER_PR_NUMBER: "1"
  # owner/repo for the gate API calls (defaults to this repository).
  SCRAPER_PR_REPO: ${{ github.repository }}

jobs:
  gate-scraper-pr:
    name: gate-scraper-pr
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      checks: read
    outputs:
      scraper_pr_merged: ${{ steps.gate.outputs.merged }}
      scraper_pr_state: ${{ steps.gate.outputs.state }}
      scraper_pr_checks: ${{ steps.gate.outputs.checks_summary }}
    steps:
      - name: Check scraper PR merge gate
        id: gate
        uses: actions/github-script@v7
        env:
          SKIP_GATE: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_gate || false }}
        with:
          script: |
            const prNumber = parseInt(process.env.SCRAPER_PR_NUMBER, 10);
            const repoFull = process.env.SCRAPER_PR_REPO;
            const [owner, repo] = repoFull.split("/");
            const skipGate = String(process.env.SKIP_GATE).toLowerCase() === "true";

            core.info(`Gate target: ${owner}/${repo}#${prNumber}`);
            core.info(`skip_gate (workflow_dispatch only): ${skipGate}`);

            const { data: pr } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: prNumber,
            });

            const merged = Boolean(pr.merged_at);
            const state = pr.state; // open | closed
            core.setOutput("merged", merged ? "true" : "false");
            core.setOutput("state", state);

            // Latest check status for PR #1's head SHA (reported in the summary).
            let checksSummary = "unavailable";
            try {
              const ref = pr.head.sha;
              const { data: combined } = await github.rest.repos.getCombinedStatusForRef({
                owner,
                repo,
                ref,
              });
              const checkRuns = await github.rest.checks.listForRef({
                owner,
                repo,
                ref,
                per_page: 100,
              });
              const runBits = (checkRuns.data.check_runs || []).map(
                (r) => `${r.name}:${r.status}/${r.conclusion || "pending"}`
              );
              const statusBits = (combined.statuses || []).map(
                (s) => `${s.context}:${s.state}`
              );
              checksSummary = [
                `combined=${combined.state}`,
                ...statusBits,
                ...runBits,
              ].join("; ") || `combined=${combined.state}`;
            } catch (err) {
              checksSummary = `error fetching checks: ${err.message || err}`;
            }
            core.setOutput("checks_summary", checksSummary);

            await core.summary
              .addHeading("Scraper PR gate")
              .addRaw(
                [
                  `| Field | Value |`,
                  `| --- | --- |`,
                  `| PR | ${owner}/${repo}#${prNumber} |`,
                  `| Title | ${pr.title} |`,
                  `| State | ${state} |`,
                  `| Merged | ${merged} |`,
                  `| Merged at | ${pr.merged_at || "—"} |`,
                  `| Head SHA | ${pr.head.sha} |`,
                  `| Base | ${pr.base.ref} |`,
                  `| Latest checks | ${checksSummary} |`,
                  `| skip_gate | ${skipGate} |`,
                ].join("\n")
              )
              .write();

            if (skipGate) {
              core.warning(
                `skip_gate=true: bypassing merge requirement for #${prNumber}. ` +
                  `Dependent jobs will run; this is for verification only.`
              );
              return;
            }

            if (!merged) {
              core.setFailed(
                `Gate failed: ${owner}/${repo}#${prNumber} is not merged ` +
                  `(state=${state}). Merge that PR before Python CI can pass. ` +
                  `Latest checks on its head: ${checksSummary}`
              );
              return;
            }

            core.info(`Gate passed: #${prNumber} is merged.`);

  check:
    name: check (Python ${{ matrix.python-version }})
    needs: gate-scraper-pr
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: python
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            python/pyproject.toml
            python/requirements.txt

      - name: Install package + dev tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff check
        run: ruff check .

      - name: Byte-compile
        run: python -m compileall -q .

      - name: Pytest smoke
        run: pytest -q

  wheels:
    name: build wheels
    needs: gate-scraper-pr
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            python/pyproject.toml
            python/requirements.txt

      - name: Install build frontend
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build wheels and sdist
        run: python -m build

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-wheels
          path: |
            python/dist/*.whl
            python/dist/*.tar.gz
          if-no-files-found: error

      - name: Smoke-test installed wheel
        run: |
          set -euo pipefail
          python -m venv /tmp/wheel-smoke
          /tmp/wheel-smoke/bin/pip install -q dist/*.whl
          /tmp/wheel-smoke/bin/stagehand-volleyball --help
          set +e
          (cd /tmp && /tmp/wheel-smoke/bin/stagehand-volleyball) > /tmp/wheel-missing.out 2>&1
          ec=$?
          set -e
          test "$ec" -ne 0
          grep -q "Could not find config.yaml" /tmp/wheel-missing.out
          grep -q "cp config.example.yaml config.yaml" /tmp/wheel-missing.out
          /tmp/wheel-smoke/bin/stagehand-volleyball \
            --config "${{ github.workspace }}/config.example.yaml" \
            --check-config | tee /tmp/wheel-check.out
          grep -q "mode:" /tmp/wheel-check.out

  shiv:
    name: build shiv binaries
    needs: gate-scraper-pr
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            python/pyproject.toml
            python/requirements.txt

      - name: Install package + shiv
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Build shiv .pyz for each console script
        run: |
          mkdir -p dist/shiv
          # Console scripts declared in pyproject.toml [project.scripts].
          # Today: stagehand-volleyball -> main:main. Add a shiv line per script.
          shiv \
            -c stagehand-volleyball \
            -o dist/shiv/stagehand-volleyball.pyz \
            .

      - name: Upload shiv artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-shiv-binaries
          path: python/dist/shiv/*.pyz
          if-no-files-found: error

      - name: Smoke-test shiv binary
        run: |
          set -euo pipefail
          PYZ=dist/shiv/stagehand-volleyball.pyz
          test -f "$PYZ"
          python "$PYZ" --help
          set +e
          (cd /tmp && python "${{ github.workspace }}/python/$PYZ") > /tmp/shiv-missing.out 2>&1
          ec=$?
          set -e
          test "$ec" -ne 0
          grep -q "Could not find config.yaml" /tmp/shiv-missing.out
          grep -q "cp config.example.yaml config.yaml" /tmp/shiv-missing.out
          python "$PYZ" \
            --config "${{ github.workspace }}/config.example.yaml" \
            --check-config | tee /tmp/shiv-check.out
          grep -q "mode:" /tmp/shiv-check.out
